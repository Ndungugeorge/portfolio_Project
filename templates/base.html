<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plant Disease Prediction App">
    <meta name="keywords" content="Plant Disease, Prediction, AI, Deep Learning">
    <meta name="author" content="Your Name">
    
    <title>{{ title }}</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1><i class="fas fa-seedling"></i> Plant Disease Prediction</h1>
            <nav>
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('home') }}">Home</a>
                    <a href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a href="{{ url_for('login') }}">Login</a>
                    <a href="{{ url_for('signup') }}">Signup</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main>
        <div class="content-container">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Plant Disease Prediction | Designed by George</p>
    </footer>
</body>
</html>
