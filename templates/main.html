{% extends "base.html" %}
{% block content %}
<section id="home" class="dashboard">
    <h2>Welcome, {{ current_user.name }}</h2>
    <p>Upload a plant image to predict diseases using our AI-powered system.</p>
    <form method="POST" action="{{ url_for('predict') }}" enctype="multipart/form-data" class="upload-form">
        <input type="file" name="image" required>
        <button type="submit" class="button">Predict Disease</button>
    </form>
</section>
{% endblock %}
